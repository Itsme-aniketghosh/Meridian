# S5's retrain rules (Model-Deployment/PLAN.md §5), written before any run. Changing one needs the team's sign-off.

[drift]
reference = "train"                # the split the new commits are compared against
days = 30                          # each block: the last N days' commits (0: every commit outside a split)
top_features = ["la", "nf", "prior_bug_fixes", "nd", "ld"]   # the top-5 SHAP features
psi_bins = 10                      # reference deciles
psi_threshold = 0.2                # PSI at or above this on any top feature: retrain
# Evidently's dataset drift, its default stattests (see drift.py): a column drifts at or above these
wasserstein_threshold = 0.1        # numeric, more than 5 distinct values, reference over 1,000 rows
jensenshannon_threshold = 0.1      # categorical, or 5 or fewer distinct values, reference over 1,000 rows
p_value = 0.05                     # KS / chi-squared, reference of 1,000 rows or fewer
share_threshold = 0.5              # this share of columns drifted or more: dataset drift, retrain

[simulate]
scale = 10                         # --simulate: every commit 10x larger
columns = ["la", "ld", "nf", "nd"]
