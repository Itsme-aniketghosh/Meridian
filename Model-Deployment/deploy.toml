# Phase 3's names and settings: contract D4 (packets/README.md). Terraform, the workflows and every script read
# this file through deploy_config.py, and no name or threshold below is written anywhere else. "{project}" stands
# for the project id, so a fresh project (bootstrap.sh <project-id>) gets its own bucket names.

[gcp]
project = "project-448b7a64-b5c5-43d3-893"   # the team's project (phase 2's registry); bootstrap.sh can override it
project_number = "541739670966"              # the team project's; workflows need it to sign in, before any terraform output
region = "us-east1"

[github]
repository = "Itsme-aniketghosh/Meridian"   # Workload Identity trusts this repository's main branch only
branch = "main"

[registry]
models = "meridian-models"   # generic, from phase 2: model versions and champion.json (model.registry --push)
model_package = "defect-risk"
pointer_package = "champion"
images = "meridian-images"   # Docker: the serving and job images
keep_images = 3              # cleanup keeps the newest 3 versions of each image and deletes older ones after a day

[images]   # image names in registry.images: <region>-docker.pkg.dev/<project>/meridian-images/<name>
risk = "risk"
refresh = "refresh"
views = "views"

[buckets]   # all private, uniform access
block = "{project}-meridian-block"       # the newest block: real names, never public
monitor = "{project}-meridian-monitor"   # D2 reports: reports/<run_id>.json
cache = "{project}-meridian-cache"       # the refresh job's clones, kept between runs
tfstate = "{project}-tfstate"            # Terraform's state; bootstrap.sh makes it before terraform init

[serve_history]   # S2's history.pkl: the refresh job (S4) writes it, deploy.yml (S3) bakes it into the image. It holds no
# email, and it's in the cache bucket, never the block (real names): the deploy account reads only history/ there (an
# IAM condition, infra/terraform/iam.tf). Both readers take the location from here
bucket = "cache"                # a [buckets] key, never "block"
object = "history/latest.pkl"   # always under history/, so a prefix grant covers it; history/<run_id>.pkl beside it

[services.risk]   # D1, PLAN §4
name = "meridian-risk"
min_instances = 0    # scales to zero: idle costs $0
max_instances = 2
cpu = "1"
memory = "1Gi"
concurrency = 20
timeout_s = 30
max_request_kb = 1024   # S2 refuses a bigger body (PLAN §4's request size cap)
public = true        # graders call it; no names out (PLAN §4)

[speed]   # S10 (PLAN §6): deploy.yml warns, and its summary reports, against these
build_s = 180     # the serving image's build, with cached layers (the Actions cache, scope "risk"): 3 minutes
serving_s = 900   # model.yml finishing on main -> the new champion serving 100%, live smoke test passed: 15 minutes

[smoke]   # S3: a revision gets traffic only after this passes against it (Model-Deployment/smoke.py)
sha = "3d819389819557523f373c192f88a594b665734d"   # a val commit (Rachna): its /score is the score it was judged on
risk_tolerance = 1e-9   # /score's risk against the same champion scoring the same row on the runner
timeout_s = 60          # per call: the first one may wait on a cold start
tries = 5               # /health is retried while the revision starts, 5 s apart

[services.views]   # S9, stretch
name = "meridian-views"

[jobs.refresh]   # S4
name = "meridian-refresh"
cpu = "2"
memory = "8Gi"      # Cloud Run's disk is memory: ~3.2 GB of files (mirror, checkout, out/, two blocks, the cache
                    # archive) plus SZZ's 2 processes (~2.5-3 GB). 4Gi can't hold both (RUN-LOG §9-10). 8Gi is
                    # the most 2 CPUs allow; about 1 cent a run
timeout_s = 7200    # 2 h: a cold run (empty cache) clones Spark and pulls all ~62k Jira tickets (35 min on Cloud Run,
                    # Nov 25), then blames every fix commit. A warm run takes ~5 min (S10, RUN-LOG §10-11)
max_retries = 1

[retrain]   # S4's retrain step (PLAN §5): what the refresh job does when D2 says retrain. Off until the team turns it on
enabled = false     # off: the job logs "retrain due, switch off" and does nothing else
until = "gate"      # on: model.refresh --refit on the new block, stopped after this step. "gate" registers nothing:
                    # the registry versions a model by its git sha and won't push from an image (team decision, Nov 25)
dispatch = false    # D3: repository_dispatch "champion-updated" after a promotion (needs MERIDIAN_GITHUB_DISPATCH)
slack_drift = false  # S7: the job's own "drift found" Slack message. Off: S6's log-based drift alert is the team's
                     # one drift message (Nov 26), so drift never posts twice

[airflow]   # The hosted Airflow (infra/terraform/airflow.tf; Aniket signed off Nov 25): Data-Pipeline's docker compose on
# one VM, for the full product pipeline (every dataset) and the weekly rebuild. Spark's daily update stays with the
# refresh job; the full block goes to the block bucket under publish_prefix, never latest.json (the job's pointer).
# No public IP: the UI is reached through an IAP tunnel to the VM's localhost:8080 (README.md, "Airflow")
name = "meridian-airflow"          # the VM; its data disk, network and policies are named after it
zone = "us-east1-b"
machine_type = "e2-standard-2"     # 2 vCPU, 8 GB: SZZ peaked at 5.15 GiB with 4 processes (RUN-LOG §9)
image = "debian-cloud/debian-12"
boot_disk_gb = 20
data_disk_gb = 50                  # the clone, snapshots/, out/, published/ and the caches; kept across restarts
ref = "main"                       # the git ref the VM checks out at each start
window_start = "45 1 * * *"        # UTC: 15 min before the update DAG (Data-Pipeline/settings.toml [dags.update])
window_stop = "0 6 * * *"          # after Sunday's rebuild (04:00 UTC). About 4 h a day: ~$9/month running
time_zone = "Etc/UTC"
snapshot_days = 7                  # a daily snapshot of the data disk, kept a week
publish_prefix = "product/"        # the only folder of the block bucket the VM can write
admin_password_secret = "MERIDIAN_AIRFLOW_ADMIN_PASSWORD"   # Secret Manager; a person adds the values
db_password_secret = "MERIDIAN_AIRFLOW_DB_PASSWORD"

[schedule]   # Cloud Scheduler starts jobs.refresh
cron = "0 3 * * *"   # daily, 03:00
time_zone = "Etc/UTC"
paused = true        # until S4's image is in; then false

[service_accounts]   # ids, before @<project>.iam.gserviceaccount.com
ci = "meridian-ci"                 # phase 2: model.yml's registry push
deploy = "meridian-deploy"         # deploy.yml: push images, deploy revisions, move traffic
risk = "meridian-risk"             # the service runs as this
refresh = "meridian-refresh"       # the job runs as this
scheduler = "meridian-scheduler"   # Cloud Scheduler starts the job as this
airflow = "meridian-airflow"       # the Airflow VM runs as this ([airflow])

[workload_identity]   # from phase 2: GitHub Actions on main, no keys
pool = "github"
provider = "meridian"

[secrets]   # Secret Manager names, the same as the env vars; a person adds the values, never git or Terraform
slack_webhook = "MERIDIAN_SLACK_WEBHOOK"       # D4's name, as in GitHub's secrets
github_dispatch = "MERIDIAN_GITHUB_DISPATCH"   # the job's token for repository_dispatch (D3)

[budget]   # C7, PLAN §6. The team's emails for the alerts stay out of git (terraform.tfvars)
amount_usd = 25
alert_at = [0.5, 0.9, 1.0]
phase_target_usd = 5
start = "2026-11-17"   # the phase, not the calendar month (a monthly budget would reset on Dec 1)
end = "2026-12-07"

[drift]   # PLAN §5, as signed off (monitor/RESULTS.md §7): retrain on PSI ≥ psi for any top feature, the last
# window_days days against the reference. Checked on val 2023 only: 0 of 12 months fire (the rules first written
# fired on 7 and 11 of 12)
window_days = 30
psi = 0.25
top_features = ["la", "nf", "prior_bug_fixes", "nd", "ld"]
reference = "latest_year"   # the newest calendar year whose labels have settled ([decay] label_window_days) at the
                            # snapshot, so it rolls forward with each refresh; "train" was 7 of 12 false alarms
dataset_share = 0.5         # Evidently's dataset drift, at this share of features drifted ...
share_retrains = false      # ... is reported, never a retrain by itself (it fired on 11 of 12 val months)

[decay]   # PLAN §5, as signed off: the newest half-year whose label window has closed, with at least min_positives
# positives. Retrain when the paired interval's lower bound against lines × files drops below min_paired_lower.
# No PR-AUC drop rule: PR-AUC falls with the positive rate, and the paired comparison already carries it
window = "half"          # quarters were 2 of 4 false alarms on val, half-years 0 of 2
label_window_days = 365
min_positives = 100
min_paired_lower = 0.0   # the paired interval's lower bound must stay above this

[service_alerts]   # PLAN §5 and §6, for S6 (infra/terraform/monitoring.tf): they page Slack and never retrain
error_rate = 0.01
error_window_min = 10   # the 5xx and p95 alerts look at the last 10 minutes
p95_latency_s = 2
cold_start_s = 15       # PLAN §6's bar: a line on the dashboard's cold-start chart, not an alert
uptime_period_s = 300   # /health from each region every 5 min: about 26,000 checks a month, of 1 million free
uptime_regions = ["USA_OREGON", "USA_IOWA", "USA_VIRGINIA"]   # Google's minimum is 3 locations

[slo]   # S6's SLO and cost panel (infra/terraform/dashboard.tf): the plan's bars as budgets over a rolling window. The
# error budget is the 1% of requests that may fail ([service_alerts] error_rate), the latency budget the 5% that may
# take longer than p95_latency_s
window_days = 7            # rolling, so the panel always shows the last week (Google allows 1 to 30)
availability_goal = 0.99   # 1 - [service_alerts] error_rate: a test keeps the two together
latency_goal = 0.95        # the 95 in p95_latency_s

[cost]   # Cloud Run's list prices in us-east1 with request-based billing (cpu_idle), cloud.google.com/run/pricing on
# Nov 24. The panel's cost per 1,000 scores uses them before the free tier, which covers all of our traffic today
vcpu_second_usd = 0.000024
gib_second_usd = 0.0000025
million_requests_usd = 0.40
