# Model pipeline config (packets/README.md, Contract 2). [data], [split] and [seed] are fixed keys.
# Each owner adds their own section below: [search.*] (Rachna), [eval] and [registry] (Rochan), [bias] and [gate] (Chaitali).

[data]
run_id = "c5118b019d642a9b"        # the block the table was built from
window_days = 365                  # Utkarsh's decision 1 can change this, by Nov 6
follow_up_end = "2025-10-01T00:00:00Z"
# Utkarsh's keys (packets/utkarsh-data/decisions.md)
start_year = 2015                  # decision 2: the first year with rows
repo = "apache/spark"
prior_fix_days = 365               # prior_bug_fixes looks back this far

[split]
train = [2015, 2022]
val = 2023
test = 2024
test_allowed = false               # Aniket flips it on Nov 12, once

[seed]
value = 1

# Rochan's keys: evaluate.py (packets/rochan-tracking/decisions.md, decisions 2-4)
[eval]
bootstrap_reps = 2000              # decision 4: the smallest stable size of 500, 1,000 and 2,000
interval = 0.95                    # bootstrap intervals from 2.5% to 97.5%
effort = 0.2                       # recall at 20% of changed lines
effort_ranking = "risk_per_line"   # decision 2: risk or risk_per_line
threshold = "precision"            # decision 3: best_f1, precision or alert_rate
threshold_precision = 0.8          # PLAN §4's push-check bar
threshold_min_alerts = 30          # 05-test: no claim below N = 30
threshold_alert_rate = 0.154       # the share of val commits today's P9 rule flags (decision 3)

# Chaitali's keys: bias.py (packets/chaitali-bias/decisions.md)
[bias]
slices = ["module", "component", "exp_bucket", "size_bucket"]   # decision 1
min_n = 30                         # judged when the count a metric is a share of reaches this (phase 1, 05-test)
max_gap = 0.10                     # flagged when the whole interval is more than this worse than overall (phase 1)
power_gap = 0.15                   # each slice reports its chance of flagging a true gap this big (decision 3)
pool_below = 30                    # decision 1: groups under this many rows merge into "(other)" (0: never)
baseline = "lines_x_files"         # decision 4: compared with the candidate at the same alert rate
accepted = []                      # flagged slices with a mitigation tried and written down: "module=core:recall"
