            git_commit: 1
            commit_file: 1
            candidate: 1
            resolution: 1
            file_owner: 1
            call_site: 1
            coverage: 1
            ticket: 1
            ticket_event: 1
            ticket_link: 1
            ticket_map: 1
            commit_ticket: 1
            file_bug_fixes: 1
            bug_inducing: 1
            person: 1
            person_alias: 1
            team_map: 1
            call_edge: 1
            module_import: 1
            blast_radius: 1
          coverage:
            call_sites_resolved: 0.95
            call_sites_owned: 0.95
            tickets_mapped_jira: 0.5
          missing:
            default: 0.0
            commit_file.old_path: 1.0
            commit_file.added: 0.2
            commit_file.deleted: 0.2
            file_owner.top_person_id: 1.0
            file_owner.last_commit_at: 0.001
            git_commit.parent_sha: 0.001
            git_commit.author_email: 0.0001
            person_alias.email: 0.0002
            team_map.subject: 0.001
            module_import.name: 0.2
            resolution.resolved_to: 0.2
            resolution.receiver_from: 1.0
            chain.to_key: 1.0
            ticket.parent_key: 1.0
            ticket.resolution: 0.5
            ticket.resolved_at: 0.3
            ticket.assignee: 0.6
            ticket.reporter: 0.0005
            ticket.description: 0.4
            ticket_event.from_value: 0.7
            ticket_event.to_value: 0.1
            ticket_event.author: 0.0005
            ticket_link.added_at: 0.6
            ticket_link.removed_at: 1.0
            ticket_map.target: 0.3
          outliers:
            iqr_k: 3.0
            max_share: 0.05
            columns:
            - commit_file.added
            - commit_file.deleted
            - file_bug_fixes.bug_fixes
            - file_owner.n_commits
            - call_site.bug_fixes
            - blast_radius.invocations
            - blast_radius.direct_sites
            log_scale:
            - added
            - deleted
            - invocations
            - direct_sites
            - n_commits
            - bug_fixes
          dates:
            columns: .*_at|at
            earliest: '2000-01-01T00:00:00Z'
            allow:
              ticket.created_at: 289
          drift:
            max_row_change: 0.2
            min_rows: 100
          ranges:
            '*.line':
            - 1
            - 100000000
            '*.col':
            - 0
            - 1000000
            '*.depth':
            - 1
            - 100
            '*.bug_fixes':
            - 0
            - 10000
            '*.seq':
            - 0
            - 100000000
            file_owner.share:
            - 0.0
            - 1.0
            file_owner.n_commits:
            - 0
            - 100000000
            commit_file.added:
            - 0
            - 100000000
            commit_file.deleted:
            - 0
            - 100000000
            coverage.numerator:
