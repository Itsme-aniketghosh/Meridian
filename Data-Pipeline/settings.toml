# Meridian settings · every setting that never changes a row, in one place.
# How and where the pipeline runs (Airflow, retries, timeouts, workers), where alerts go, what the data checks and the
# bias slicing allow. Not part of the run_id: collect hashes only meridian.toml, so this file can change any time
# without a new team run. The rule: nothing here may change a row. Whatever changes what a part computes belongs in
# meridian.toml. Parts read a section with common.load_settings(section); $MERIDIAN_SETTINGS points at another copy.
# Secrets never go here, or anywhere in git: a setting names the environment variable that holds one (.env.example).

# ───────────── the run the pipeline works on ─────────────

[pipeline]
run_id = "70dd1dabfed544b8"           # the team run (shared-snapshot/README.md). The DAG never makes a new one
prev_run = ""                         # the last run, for join's matching and validate's drift. "" = first run
config = "meridian.toml"              # what the parts compute

# ───────────── orchestration (Airflow) ─────────────

[orchestration]                       # both DAGs (dags/meridian_dag.py); each one's id and schedule in [dags.*]
tool = "airflow"
retries = 2
task_retries = { validate = 0 }       # per task, over retries: validate's errors are in the data, a retry finds them again
retry_delay_minutes = 5
max_active_tasks = 4                  # parts that may run at once: history next to scan and resolve
task_runner = "bash"                  # "bash": each part is a command in the Airflow container (docker-compose.yaml).
                                      # "cloud_run_job" on GCP, once it's set up
python = "/opt/meridian-venv/bin/python"   # the pipeline's own environment in the image, built from requirements.txt
image = "us-east1-docker.pkg.dev/meridian-pipeline/meridian/pipeline"   # Artifact Registry path. Placeholder until GCP is set up
snapshot_bucket = "gs://meridian-pipeline-snapshots"                   # raw pulls and snapshots, replaces shared-snapshot/. Placeholder until GCP is set up
alert_on = ["failed", "halted", "partial"]

[orchestration.timeout_minutes]       # a task running longer than this is killed and retried
anything_new = 5
fresh = 5
collect = 90                          # a new run checks out ~2.5 GB, slow on a mounted volume
history = 60
scan = 20
resolve = 60
owners = 20
join = 30
graph = 10
validate = 30
bias = 20
report = 20
compare = 20
gx = 20
publish = 30                          # with [dvc] push, the upload

[dags.update]                         # the "Update graph" click (a trigger, through the UI or the REST API) and daily
dag_id = "meridian_update"
schedule = "0 2 * * *"                # 02:00 UTC. "" = only when triggered
api = "http://localhost:8080/api/v1"  # Airflow's REST API, for the dashboard's "Update graph" button
api_user_env = "AIRFLOW_ADMIN_USER"  # the environment variables holding its login: the UI's, from .env
api_password_env = "AIRFLOW_ADMIN_PASSWORD"

[dags.rebuild]                        # everything from scratch, compared with the updates
dag_id = "meridian_rebuild"
schedule = "0 4 * * 0"                # Sunday 04:00 UTC, after the day's update
data_root = "rebuild"                 # its own snapshots/ (a link to the real one) and out/, under the data root

# ───────────── publishing and staleness ─────────────

[gx]                                  # meridian.gx: the weekly Great Expectations audit (rebuild only, never gates)
python = "/opt/meridian-gx-venv/bin/python"   # its own environment in the image, built from requirements-gx.txt. The
                                      # checks are [validate]'s rows, missing, formats, ranges and dates; the Data Docs
                                      # go to [publish] dir/gx/<run_id>/

[publish]
dir = "published"                     # under the data root: <run_id>.sqlite per published run, latest.json -> the live one

[status]                              # meridian.status: "data 2 days old · 14 new commits"
mirrors = "snapshots/_cache/repos"    # under the data root: one bare <owner>__<name>.git per repo (collect's)
fetch = true                          # fetch the mirror of a repo that follows a branch before counting its new commits,
                                      # so a push since the last collect is seen. Pinned repos are never fetched
stale_after_hours = 20                # a publish older than this counts as new: ticket changes can't be seen without a pull.
                                      # Under a day: the next daily check comes under 24 h after the last daily publish

# ───────────── alerts ─────────────

[alerts]
on = ["failure", "error", "warn"]     # what sends one: a failed task, a data error, a data warning
email_to = []                         # addresses, e.g. ["team@example.com"]. Empty: no email
email_from = "meridian@localhost"
smtp_host = "localhost"
smtp_port = 25                        # 587 with smtp_starttls = true for most providers
smtp_starttls = false
smtp_user_env = "MERIDIAN_SMTP_USER"          # the environment variable holding the SMTP user, if it needs one
smtp_password_env = "MERIDIAN_SMTP_PASSWORD"  # ... and its password
slack_webhook_env = "MERIDIAN_SLACK_WEBHOOK"  # the environment variable holding a Slack incoming-webhook URL
timeout_s = 10
max_lines = 20                        # an alert lists at most this many findings; the rest are in anomalies.json

# ───────────── network and workers, per part ─────────────

[collect]                             # network: how hard collect tries, never what it keeps
http_tries = 6                        # curl attempts per request
http_timeout_s = 120                  # per attempt
http_backoff_s = 1                    # wait 2^attempt x this between attempts
http_429_factor = 10                  # x this again when the server says 429 (rate limit)
graphql_tries = 6                     # GitLab GraphQL: attempts when the answer carries "errors"
graphql_backoff_s = 5                 # wait (attempt + 1) x this
gitlab_batch = 20                     # issues per notes / parents query (GitLab caps iids lists)
mirrors = "snapshots/_cache/repos"    # one bare mirror per repo, under $MERIDIAN_DATA, kept between runs (git fetch, never
                                      # cloned twice). Every snapshot's checkout borrows its objects: moving it breaks them
delta_overlap_minutes = 1440          # a ticket delta asks for changes since the last pull started, less this: Jira reads
                                      # the time in its own zone. Tickets pulled twice come back the same

[history]
szz_workers = 0                       # SZZ processes. 0 = one per CPU

# ───────────── caches (notes/UPDATE-PLAN.md, Phase 3) ─────────────
# Each switch lets a part reuse its last results for inputs that didn't change. All off: Phase 3 is signed off "only
# if runs get slow". On or off, a part writes the same bytes (tests/test_cache.py). A cache lives under the data root in
# snapshots/_cache/{scan,resolve,szz}/<repo>.json, is never hashed into a run, and keeps only what its last run used.
# Delete a folder to start that cache over. The Sunday rebuild runs with all three off (MERIDIAN_NO_CACHE).

[cache]
scan = false                          # per file: its git blob SHA, path and kind, scan.py, tree-sitter's versions, the
                                      # repo's symbols and [scanner]. A file whose key is unchanged keeps its rows
resolve = false                       # per file: resolve.py and scan.py, the versions, the repo's symbols and [resolver]
                                      # rules, the dependencies' SHAs (Django, for the packages), every file name in the
                                      # checkout, the file's candidates, and the blob of every repo file Jedi read for it
                                      # (what it imports, however deep). A push that adds or deletes a file redoes the
                                      # repo. call_edge is always rebuilt
szz = false                           # per fix commit: its SHA, szz.py, [szz] test_paths and comment_prefixes, git's
                                      # version. Only new fix commits are blamed; key and file_bug_fixes are redone

# ───────────── data checks (meridian.validate) ─────────────
# Allowances were measured on run 70dd1dabfed544b8 (Oct 24) and carry the reason a column may be empty. Change one
# only with a commit that says why.

[validate]
top_values = 10                       # stats.json lists the most common values of a column with at most this many

[validate.rows]                       # fewer rows than this is an error: a part ran but wrote (almost) nothing
run = 1
git_commit = 1
commit_file = 1
candidate = 1
resolution = 1
file_owner = 1
call_site = 1
coverage = 1
ticket = 1
ticket_event = 1
ticket_link = 1
ticket_map = 1
commit_ticket = 1
file_bug_fixes = 1
bug_inducing = 1
person = 1
person_alias = 1
team_map = 1
call_edge = 1
module_import = 1
blast_radius = 1                      # blocked_by, parse_failure, deprecation and chain can rightly be empty

[validate.coverage]                   # numerator / denominator below the floor is an error
call_sites_resolved = 0.95            # 05-test: resolver recall >= 0.95. Run 70dd: 1,525 of 1,526
call_sites_owned = 0.95               # every call site has an owner team or is counted unowned. 70dd: 1.0
tickets_mapped_jira = 0.50            # 70dd: 0.61. A drop means links or commit keys broke

[validate.missing]                    # share of NULL or '' allowed per column, else a warning. Unlisted columns: none
default = 0.0
"commit_file.old_path" = 1.0          # set on renames only (5% of rows)
"commit_file.added" = 0.2             # NULL for binary files (10%)
"commit_file.deleted" = 0.2
"file_owner.top_person_id" = 1.0      # path- and repo-owned files have no person (75%)
"file_owner.last_commit_at" = 0.001   # no commit in the window: 1 Django file
"git_commit.parent_sha" = 0.001       # root commits: 23 of 139,228
"git_commit.author_email" = 0.0001    # git allows an empty email: 1 commit
"person_alias.email" = 0.0002         # the same commit's empty email
"team_map.subject" = 0.001            # Django's '' path prefix is the root team
"module_import.name" = 0.2            # '' for 'import m' (10%)
"resolution.resolved_to" = 0.2        # NULL when unresolved or dropped (10%)
"resolution.receiver_from" = 1.0      # set only for recv.f() where recv = F(...): none on 70dd
"chain.to_key" = 1.0                  # '' on untracked rows
"ticket.parent_key" = 1.0             # sub-tasks only
"ticket.resolution" = 0.5             # open tickets (28%)
"ticket.resolved_at" = 0.3            # open tickets (13%)
"ticket.assignee" = 0.6               # unassigned tickets (36%)
"ticket.reporter" = 0.0005            # deleted accounts: 5 tickets
"ticket.description" = 0.4            # empty descriptions (19%): the ticket check "no description" reads them
"ticket_event.from_value" = 0.7       # a field set for the first time (52%)
"ticket_event.to_value" = 0.1         # a field cleared (3%)
"ticket_event.author" = 0.0005        # deleted accounts: 18 events
"ticket_link.added_at" = 0.6          # links older than the changelog (39%)
"ticket_link.removed_at" = 1.0        # set only on removed links
"ticket_map.target" = 0.3             # '' on unmapped tickets (15%)

[validate.outliers]                   # share of values beyond Q1 - k*IQR or Q3 + k*IQR above max_share is a warning
iqr_k = 3.0
max_share = 0.05
columns = ["commit_file.added", "commit_file.deleted", "file_bug_fixes.bug_fixes", "file_owner.n_commits",
           "call_site.bug_fixes", "blast_radius.invocations", "blast_radius.direct_sites"]
# counts with a long tail: fences on log(1 + x). On a raw scale 10% of commits are "outliers" (70dd), which says
# nothing; on a log scale only the truly huge ones are
log_scale = ["added", "deleted", "invocations", "direct_sites", "n_commits", "bug_fixes"]

[validate.dates]                      # a time before earliest, or after the run's snapshot_at, is a warning. On 70dd:
columns = '.*_at|at'                  # 289 Spark tickets filed in the years 0010-0012, as Apache Jira itself has them
earliest = "2000-01-01T00:00:00Z"     # (the 2013 import from Spark's old tracker): the source is wrong, not us
allow = {"ticket.created_at" = 289}  # known bad dates per column: warn only above this many, so the alert stays news

[validate.drift]                      # with prev_run: a table's row count moving more than this is a warning
max_row_change = 0.2
min_rows = 100                        # a table smaller than this last run never drifts: 3 -> 5 rows is noise

[validate.ranges]                     # "table.column" or "*.column": [min, max]. A value outside is an error
"*.line" = [1, 100000000]
"*.col" = [0, 1000000]
"*.depth" = [1, 100]
"*.bug_fixes" = [0, 10000]            # 70dd: at most 36
"*.seq" = [0, 100000000]
"file_owner.share" = [0.0, 1.0]
"file_owner.n_commits" = [0, 100000000]
"commit_file.added" = [0, 100000000]
"commit_file.deleted" = [0, 100000000]
"coverage.numerator" = [0, 100000000000]
"coverage.denominator" = [0, 100000000000]
"*.invocations" = [0, 100000000]
"*.direct_sites" = [0, 100000000]
"blast_radius.files" = [0, 100000000]

# A value of a matching column that doesn't fit is an error (CONTRACTS.md, "Rules for every table").
[[validate.formats]]
name = "UTC times YYYY-MM-DDTHH:MM:SSZ"
columns = '.*_at|at|effective_date|window_start|window_end'
pattern = '\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])T([01]\d|2[0-3]):[0-5]\d:[0-5]\dZ'

[[validate.formats]]
name = "16-hex content IDs"
columns = 'call_site_id|blocker_id|person_id|top_person_id'
pattern = '[0-9a-f]{16}'

[[validate.formats]]
name = "40-hex git SHAs"
columns = 'sha|parent_sha|fix_sha|inducing_sha|effective_sha|introduced_sha'
pattern = '[0-9a-f]{40}'

[[validate.formats]]
name = "'owner/name' repos"
columns = 'repo|callee_repo'
pattern = '[^/\s]+/[^/\s]+'

[[validate.formats]]
name = "repo-relative POSIX paths"
columns = 'path|old_path|caller_path|callee_path'
pattern = '(?!/)(?!(?:.*/)?\.\.(?:/|$))[^\\]+'  # no leading '/', no '..' segment, no '\'

[[validate.formats]]
name = "ticket keys: Jira PROJ-N, GitLab owner/name#N or epic group&N"
columns = 'key|other_key|parent_key'
tables = ["ticket", "ticket_event", "ticket_link", "ticket_map", "commit_ticket"]
pattern = '[A-Z][A-Z0-9_]*-\d+|[^\s#&]+/[^\s#&]+#\d+|[^\s#&]+&\d+'  # 70dd: 7,884 links point at epics

[[validate.formats]]
name = "sorted JSON lists"
columns = 'components|fix_keys|evidence'
pattern = "sorted_json_list"

# ───────────── bias slicing (meridian.bias) ─────────────

[bias]
min_n = 30                            # a slice needs this many rows to be judged (05-test: no claim below N = 30)
max_gap = 0.10                        # flagged when its metric is more than this below the overall value
min_shares = [0.30, 0.20, 0.10]       # owner-rule thresholds scored as mitigations; the first is meridian.toml's
team_lookback_days = [180, 365, 730]  # how far back a person's commits give them a team, scored as a mitigation
recent_since = "2020"                 # ticket mapping is sliced again on tickets filed since this year: old tickets'
                                      # files are often gone, so this separates a component's age from its gap

# ───────────── data versioning ─────────────

[dvc]
push = false                          # publish runs dvc commit and push to the DVC remote when true (.dvc/config names it)

# ───────────── push check (meridian.pushcheck, .github/workflows/push-check.yml) ─────────────

[push_check]
# PLACEHOLDER: where meridian.publish puts the last published meridian.sqlite. Not settled yet (publish is being built).
# The workflow fetches it with curl, so an https URL works as is; a gs:// path needs the workflow's fetch step swapped
# for `gcloud storage cp` after google-github-actions/auth. "" = no base map: the check posts nothing (04 §10)
base_block_url = ""
max_scope_files = 200                 # 04 §10: changed files + importers over this, skip (said in one line)
max_lines = 10                        # 04 §10: one comment, at most 10 findings
defect_risk_threshold = 2000          # P9: lines × files above this. Not measured yet: 05-test's "P9 vs SZZ" sets it

# Optional (Phase 2): a push to a watched repo's main branch starts the update DAG through Airflow's REST API
# (.github/workflows/trigger-update.yml). max_active_runs = 1 and the "anything new?" step make a burst of pushes one run
airflow_url = ""                      # e.g. https://airflow.example.com. "" = don't trigger
airflow_dag_id = "meridian_update"
airflow_user_env = "MERIDIAN_AIRFLOW_USER"          # the secret holding the Airflow API user
airflow_password_env = "MERIDIAN_AIRFLOW_PASSWORD"  # ... and its password
