# Every test that needs no team data, on Linux and Windows, then the Airflow ones in the Docker image. The team-run
# tests skip here (TESTING.md).
name: ci

on:  # a same-repo PR's branch is checked once, by its pull_request run
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.11"
      # The whole environment is cached, not just the downloads: installing took 93 s of Windows' 3.5 minutes.
      # The key has the exact Python, so a runner update never reuses a venv built on another one.
      - uses: actions/cache@v4
        id: venv
        with:
          path: .venv
          key: venv-data-${{ runner.os }}-${{ steps.py.outputs.python-version }}-${{ hashFiles('Data-Pipeline/requirements.txt') }}
      - if: steps.venv.outputs.cache-hit != 'true'
        run: python -m venv .venv
        working-directory: .
      - shell: bash
        run: echo "$GITHUB_WORKSPACE/.venv/$([ "$RUNNER_OS" = Windows ] && echo Scripts || echo bin)" >> "$GITHUB_PATH"
      - if: steps.venv.outputs.cache-hit != 'true'
        run: python -m pip install -r Data-Pipeline/requirements.txt flake8==7.4.1  # the data lockfile only
        working-directory: .
      - run: python -m flake8 meridian dags tests run_demo.py check_csv.py labels
        working-directory: Data-Pipeline
      - run: python -m unittest discover -s tests -t .
        working-directory: Data-Pipeline

  model:  # Model-Pipeline's tests and flake8, in its own environment (Model-Pipeline/requirements.txt)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Model-Pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.11"
      # The whole environment is cached, not just the downloads: installing took 93 s of Windows' 3.5 minutes.
      # The key has the exact Python, so a runner update never reuses a venv built on another one.
      - uses: actions/cache@v4
        id: venv
        with:
          path: .venv
          key: venv-model-${{ runner.os }}-${{ steps.py.outputs.python-version }}-${{ hashFiles('Data-Pipeline/requirements.txt', 'Model-Pipeline/requirements.txt') }}
      - if: steps.venv.outputs.cache-hit != 'true'
        run: python -m venv .venv
        working-directory: .
      - shell: bash
        run: echo "$GITHUB_WORKSPACE/.venv/$([ "$RUNNER_OS" = Windows ] && echo Scripts || echo bin)" >> "$GITHUB_PATH"
      - if: steps.venv.outputs.cache-hit != 'true'
        run: python -m pip install -r Model-Pipeline/requirements.txt flake8==7.4.1
        working-directory: .
      - run: python -m flake8 --config ../Data-Pipeline/setup.cfg model tests  # the same rules as Data-Pipeline
      - run: python -m unittest discover -s tests -t .

  gx:  # tests.test_gx in the GX audit's own environment (requirements-gx.txt), as the weekly rebuild runs it
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Data-Pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Data-Pipeline/requirements-gx.txt
      - run: python -m venv /tmp/gx && /tmp/gx/bin/pip install -r requirements-gx.txt
      - run: /tmp/gx/bin/python -m unittest tests.test_gx -v

  pushcheck:  # tests.test_pushcheck with only the packages push-check.yml installs: a new import there fails here first
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Data-Pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Data-Pipeline/requirements.txt
      - run: >-
          python -m venv /tmp/pc &&
          grep -E '^(tree-sitter|jedi|parso)' requirements.txt | /tmp/pc/bin/pip install -r /dev/stdin
      - run: /tmp/pc/bin/python -m unittest tests.test_pushcheck -v

  airflow:  # test_dag's last 5 tests: Airflow's own DagBag loads both DAGs, in the image the pipeline runs in
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Data-Pipeline
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && sed -i "s/^AIRFLOW_UID=.*/AIRFLOW_UID=$(id -u)/" .env
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6  # the image docker-compose.yaml names, with its layers cached
        with:
          context: .
          file: Data-Pipeline/Dockerfile
          tags: meridian-airflow:local
          load: true
          cache-from: type=gha,scope=airflow
          cache-to: type=gha,scope=airflow,mode=max
      - run: >-
          docker compose run --rm --no-deps -e CONNECTION_CHECK_MAX_COUNT=0 -w /opt/meridian/Data-Pipeline
          airflow-scheduler python -m unittest tests.test_dag -v
