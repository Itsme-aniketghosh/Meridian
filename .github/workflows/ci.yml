# Every test that needs no team data, on Linux and Windows, then the Airflow ones in the Docker image. The team-run
# tests skip here (TESTING.md).
name: ci

on:  # a same-repo PR's branch is checked once, by its pull_request run
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r Data-Pipeline/requirements.txt  # the data pipeline's own lockfile, not the model's
      - run: pip install flake8==7.4.1 && python -m flake8 meridian dags tests run_demo.py check_csv.py labels
        working-directory: Data-Pipeline
      - run: python -m unittest discover -s tests -t .
        working-directory: Data-Pipeline

  model:  # Model-Pipeline's tests and flake8, in its own environment (Model-Pipeline/requirements.txt)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Model-Pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            Data-Pipeline/requirements.txt
            Model-Pipeline/requirements.txt
      - run: pip install -r requirements.txt flake8==7.4.1
      - run: python -m flake8 --config ../Data-Pipeline/setup.cfg model tests  # the same rules as Data-Pipeline
      - run: python -m unittest discover -s tests -t .

  gx:  # tests.test_gx in the GX audit's own environment (requirements-gx.txt), as the weekly rebuild runs it
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Data-Pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m venv /tmp/gx && /tmp/gx/bin/pip install -r requirements-gx.txt
      - run: /tmp/gx/bin/python -m unittest tests.test_gx -v

  pushcheck:  # tests.test_pushcheck with only the packages push-check.yml installs: a new import there fails here first
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Data-Pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: >-
          python -m venv /tmp/pc &&
          grep -E '^(tree-sitter|jedi|parso)' requirements.txt | /tmp/pc/bin/pip install -r /dev/stdin
      - run: /tmp/pc/bin/python -m unittest tests.test_pushcheck -v

  airflow:  # test_dag's last 5 tests: Airflow's own DagBag loads both DAGs, in the image the pipeline runs in
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Data-Pipeline
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && sed -i "s/^AIRFLOW_UID=.*/AIRFLOW_UID=$(id -u)/" .env
      - run: docker compose build airflow-scheduler
      - run: >-
          docker compose run --rm --no-deps -e CONNECTION_CHECK_MAX_COUNT=0 -w /opt/meridian/Data-Pipeline
          airflow-scheduler python -m unittest tests.test_dag -v
