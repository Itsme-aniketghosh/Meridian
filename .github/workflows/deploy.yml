# S3 (Model-Deployment/PLAN.md): ship the champion to Cloud Run. Every run reads deploy.toml (D4), gets the champion
# and checks its md5, builds the serving image (S2's Dockerfile) and smoke-tests it on the runner. On main it then
# pushes the image, deploys it as a revision with no traffic, and smoke-tests that revision through its tag URL. Only
# when that passes, and the image holds history.pkl, does traffic move to it: first the canary (deploy.toml [canary],
# Nov 27), 10% for 3 minutes judged on errors and p95 latency (canary.py), then 100%; then the service's own URL is
# smoke-tested. Until then the old revision keeps serving. If the canary, the move or that test fails, traffic goes
# straight back to the revision that served before (rollback) and the run is red. Slack hears the outcome on main
# (S7, notify.py).
#
# Triggers (Nov 25): a PR (dry run), by hand, model.yml finishing green on main, and D3's repository_dispatch
# "champion-updated" from the refresh job. The two automatic ones deploy only a champion that doesn't serve yet: if
# the service's /health already names its version and md5, the run ends green after the champion check, with nothing
# built, pushed or sent. A dispatch must name the registry pointer's champion, or the run stops red before the build.
#
# The champion: on main, the registry pointer on Artifact Registry, read as the deploy account through Workload
# Identity (main only, as in phase 2). Anywhere else, the committed Model-Pipeline/registry/. Either way its model
# file's md5 must be the record's (Model-Deployment/champion.py).
name: deploy

on:
  pull_request:
    paths:
      - ".github/workflows/deploy.yml"
      - "Model-Deployment/champion.py"
      - "Model-Deployment/smoke.py"
      - "Model-Deployment/traffic.py"
      - "Model-Deployment/notify.py"
      - "Model-Deployment/canary.py"
      - "Model-Deployment/deploy.toml"
      - "Model-Deployment/deploy_config.py"
      - "Model-Deployment/serve/**"
      - "Model-Deployment/tests/test_champion.py"
      - "Model-Deployment/tests/test_smoke.py"
      - "Model-Deployment/tests/test_traffic.py"
      - "Model-Deployment/tests/test_notify.py"
      - "Model-Deployment/tests/test_canary.py"
      - "Data-Pipeline/meridian/alert.py"
      - "Data-Pipeline/settings.toml"
      - "Model-Deployment/tests/test_serve_history.py"
      - "Model-Pipeline/registry/**"
  workflow_dispatch:
    inputs:
      move_traffic:
        description: "Move traffic to the new revision after its smoke test (off: stop at the no-traffic revision)"
        type: boolean
        default: true
  workflow_run:   # model.yml on main: a promotion moves the registry pointer, then this deploys it
    workflows: [model]
    types: [completed]
    branches: [main]
  repository_dispatch:   # D3 from the refresh job: {version, md5, reason, report}
    types: [champion-updated]

permissions:
  contents: read
  id-token: write   # Workload Identity, on main only

concurrency:   # one deploy at a time; a PR's newer push replaces its older dry run
  group: deploy-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    # model.yml must have passed, on a push or by hand on main (never a PR's run)
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ON_MAIN: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      MOVE_TRAFFIC: ${{ github.event.inputs.move_traffic != 'false' }}   # a trigger without inputs moves traffic
      DRY_RUN: ${{ !(github.ref == 'refs/heads/main' && github.event_name != 'pull_request') }}   # PRs: build, never push
      AUTO: ${{ github.event_name == 'workflow_run' || github.event_name == 'repository_dispatch' }}   # not by hand
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.11"

      # model.registry reads md5s through model.evaluate, which needs the model's packages: the same cached
      # environment model.yml uses on main
      - uses: actions/cache@v4
        id: venv
        with:
          path: .venv
          key: venv-model-${{ runner.os }}-${{ steps.py.outputs.python-version }}-${{ hashFiles('Data-Pipeline/requirements.txt', 'Model-Pipeline/requirements.txt') }}
      - name: Install the model's packages
        run: |
          [ "${{ steps.venv.outputs.cache-hit }}" = "true" ] || { python -m venv .venv && .venv/bin/pip install -r Model-Pipeline/requirements.txt; }
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Tests (champion.py, smoke.py, deploy.toml)
        run: python -m unittest discover -s Model-Deployment/tests

      - name: flake8 (champion.py, smoke.py, traffic.py, notify.py, canary.py)
        run: |
          python -m pip install --quiet flake8==7.4.1
          python -m flake8 --max-line-length 120 Model-Deployment/champion.py Model-Deployment/smoke.py Model-Deployment/traffic.py \
            Model-Deployment/notify.py Model-Deployment/canary.py

      - name: Names from deploy.toml (D4)
        id: cfg
        run: |
          get() { python Model-Deployment/deploy_config.py --get "$1"; }
          {
            echo "project=$(get gcp.project)"
            echo "region=$(get gcp.region)"
            echo "service=$(get services.risk.name)"
            echo "image=$(get derived.images.risk)"
            echo "provider=$(get derived.workload_identity_provider)"
            echo "deploy_sa=$(get derived.service_accounts.deploy)"
            echo "history=gs://$(get "buckets.$(get serve_history.bucket)")/$(get serve_history.object)"
            echo "canary_percent=$(get canary.percent)"
          } | tee -a "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v2
        if: env.ON_MAIN == 'true'
        with:
          workload_identity_provider: ${{ steps.cfg.outputs.provider }}
          service_account: ${{ steps.cfg.outputs.deploy_sa }}
      - uses: google-github-actions/setup-gcloud@v2
        if: env.ON_MAIN == 'true'

      - name: The champion, checked
        id: champion
        run: |
          python Model-Deployment/champion.py --source "${{ env.ON_MAIN == 'true' && 'pointer' || 'committed' }}" \
            --dest "$RUNNER_TEMP/champion" --stage "$RUNNER_TEMP/stage" --github-output "$GITHUB_OUTPUT"

      # D3: the dispatch names the champion it promoted; the pointer must agree, or nothing is deployed
      - name: The dispatch's champion (D3)
        id: dispatch
        if: github.event_name == 'repository_dispatch'
        env:
          SENT_VERSION: ${{ github.event.client_payload.version }}
          SENT_MD5: ${{ github.event.client_payload.md5 }}
          VERSION: ${{ steps.champion.outputs.version }}
          MD5: ${{ steps.champion.outputs.md5 }}
        run: |
          if [ "$SENT_VERSION" != "$VERSION" ] || [ "$SENT_MD5" != "$MD5" ]; then
            echo "::error::the dispatch names ${SENT_VERSION:0:12} md5 ${SENT_MD5}, the registry pointer holds ${VERSION:0:12} md5 ${MD5}: nothing deployed"
            exit 1
          fi
          echo "the dispatch's champion is the pointer's: ${VERSION:0:12} md5 ${MD5}"

      # An automatic run with a champion that already serves stops here, green: model.yml runs on every push to main,
      # and a new revision of the same model would cost a build and a deploy for nothing. A run by hand always deploys
      - name: Already serving? (automatic triggers, main)
        id: current
        if: env.ON_MAIN == 'true' && env.AUTO == 'true'
        env:
          SERVICE: ${{ steps.cfg.outputs.service }}
          WHERE: --region=${{ steps.cfg.outputs.region }} --project=${{ steps.cfg.outputs.project }}
          VERSION: ${{ steps.champion.outputs.version }}
          MD5: ${{ steps.champion.outputs.md5 }}
        run: |
          # shellcheck disable=SC2086
          url=$(gcloud run services describe "$SERVICE" $WHERE --format='value(status.url)' 2>/dev/null || true)
          now=$( [ -n "$url" ] && curl -s --max-time 60 "$url/health" | jq -r '"\(.model.version) \(.model.md5)"' 2>/dev/null || true)
          echo "serving now: ${now:-nothing} at ${url:-no URL}"
          if [ "$now" = "$VERSION $MD5" ]; then
            echo "ALREADY_SERVING=true" >> "$GITHUB_ENV"
            echo "serving=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${VERSION:0:12} md5 ${MD5} already serves at $url: nothing to deploy"
          else
            echo "serving=false" >> "$GITHUB_OUTPUT"
          fi

      # S2's handoff: pushes are scored from the block's precomputed history, baked into the image. It holds no email
      # (serve.precompute) and is never committed, and it's read from deploy.toml [serve_history], never from anywhere
      # the deploy account could see real names. Without it the image scores known SHAs only
      - name: history.pkl, for pushes
        id: history
        if: env.ALREADY_SERVING != 'true'
        env:
          SRC: ${{ steps.cfg.outputs.history }}
        run: |
          if [ "$ON_MAIN" = true ] && gcloud storage cp "$SRC" Model-Deployment/serve/history.pkl; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            if [ "$ON_MAIN" = true ]; then
              echo "::warning::no $SRC (or no read access to it): the image scores known SHAs only, not pushes"
            else
              echo "::notice::off main there's no GCS: the image scores known SHAs only, not pushes"
            fi
          fi

      # Rachna's image (S2) bakes the champion in at build: it's handed over as the build context's
      # Model-Pipeline/registry/, which is the committed champion off main and the pointer's on main
      - name: Build the serving image
        id: build
        if: env.ALREADY_SERVING != 'true'
        env:
          IMAGE: ${{ steps.cfg.outputs.image }}:${{ steps.champion.outputs.version }}
        run: |
          cp "$RUNNER_TEMP/stage/"* Model-Pipeline/registry/
          start=$(date +%s)
          docker build -f Model-Deployment/serve/Dockerfile \
            --build-arg MODEL_VERSION="${{ steps.champion.outputs.version }}" \
            --build-arg MODEL_MD5="${{ steps.champion.outputs.md5 }}" \
            -t "$IMAGE" .
          { echo "build_s=$(( $(date +%s) - start ))"
            echo "size_mb=$(( $(docker image inspect --format '{{.Size}}' "$IMAGE") / 1000000 ))"; } >> "$GITHUB_OUTPUT"

      # The image itself, before anything leaves the runner: a failure here stops the run before the push
      - name: Smoke test, the image on the runner
        id: smoke_local
        if: env.ALREADY_SERVING != 'true'
        env:
          IMAGE: ${{ steps.cfg.outputs.image }}:${{ steps.champion.outputs.version }}
        run: |
          docker run -d --name risk -p 8080:8080 "$IMAGE" >/dev/null
          trap 'echo "--- the container log"; docker logs risk 2>&1 | tail -20; docker rm -f risk >/dev/null' EXIT
          python Model-Deployment/smoke.py --url http://localhost:8080 --wait 2 \
            --version "${{ steps.champion.outputs.version }}" --md5 "${{ steps.champion.outputs.md5 }}" \
            --champion "$RUNNER_TEMP/stage/champion.json"

      - name: Push the image (main)
        id: push
        if: env.ON_MAIN == 'true' && env.ALREADY_SERVING != 'true'
        env:
          IMAGE: ${{ steps.cfg.outputs.image }}:${{ steps.champion.outputs.version }}
        run: |
          gcloud auth configure-docker "${IMAGE%%/*}" --quiet
          start=$(date +%s)
          docker push --quiet "$IMAGE"
          { echo "digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE")"
            echo "push_s=$(( $(date +%s) - start ))"; } >> "$GITHUB_OUTPUT"

      # A new revision with 0% of traffic, reachable only at its tag's URL: the old revision keeps serving
      - name: Deploy a revision with no traffic (main)
        id: revision
        if: env.ON_MAIN == 'true' && env.ALREADY_SERVING != 'true'
        env:
          SERVICE: ${{ steps.cfg.outputs.service }}
          WHERE: --region=${{ steps.cfg.outputs.region }} --project=${{ steps.cfg.outputs.project }}
          DIGEST: ${{ steps.push.outputs.digest }}
          VERSION: ${{ steps.champion.outputs.version }}
        run: |
          tag="c-${VERSION:0:12}"
          # what serves now, before the deploy: the revision a failed move goes back to (rollback, Nov 23)
          # shellcheck disable=SC2086
          gcloud run services describe "$SERVICE" $WHERE --format=json > "$RUNNER_TEMP/before.json"
          python Model-Deployment/traffic.py serving "$RUNNER_TEMP/before.json" --key previous >> "$GITHUB_OUTPUT"
          start=$(date +%s)
          # shellcheck disable=SC2086
          gcloud run deploy "$SERVICE" $WHERE --image "$DIGEST" --no-traffic --tag "$tag" --quiet
          # shellcheck disable=SC2086
          gcloud run services describe "$SERVICE" $WHERE --format=json > "$RUNNER_TEMP/service.json"
          python Model-Deployment/traffic.py tagged "$RUNNER_TEMP/service.json" "$tag" >> "$GITHUB_OUTPUT"
          echo "deploy_s=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"

      - name: Smoke test, the revision (main)
        id: smoke
        if: env.ON_MAIN == 'true' && env.ALREADY_SERVING != 'true'
        run: |
          python Model-Deployment/smoke.py --url "${{ steps.revision.outputs.url }}" \
            --version "${{ steps.champion.outputs.version }}" --md5 "${{ steps.champion.outputs.md5 }}" \
            --champion "$RUNNER_TEMP/stage/champion.json" --github-output "$GITHUB_OUTPUT"

      # The canary (Nov 27): the revision that just passed takes [canary] percent of traffic, by name, and the one
      # that served before keeps the rest. canary.py watches it on errors and p95 latency for [canary] watch_s; a
      # failure rolls back. An image without history.pkl would refuse every push, so it never gets traffic
      - name: Canary, a share of traffic to the new revision (main)
        id: canary
        if: env.ON_MAIN == 'true' && env.MOVE_TRAFFIC == 'true' && env.ALREADY_SERVING != 'true' && steps.cfg.outputs.canary_percent != '0'
        env:
          SERVICE: ${{ steps.cfg.outputs.service }}
          WHERE: --region=${{ steps.cfg.outputs.region }} --project=${{ steps.cfg.outputs.project }}
          REVISION: ${{ steps.revision.outputs.name }}
          PREVIOUS: ${{ steps.revision.outputs.previous_revision }}
          PERCENT: ${{ steps.cfg.outputs.canary_percent }}
          TAG_URL: ${{ steps.revision.outputs.url }}
          VERSION: ${{ steps.champion.outputs.version }}
        run: |
          if [ "${{ steps.history.outputs.present }}" != true ]; then
            echo "::error::won't move traffic: the image has no history.pkl, so it scores known SHAs only and refuses every push. ${REVISION} stays at 0%"
            exit 1
          fi
          if [ -z "$PREVIOUS" ] || [ "$PREVIOUS" = "$REVISION" ]; then
            echo "::error::no earlier revision to split with: the canary needs the revision that serves now"
            exit 1
          fi
          # shellcheck disable=SC2086
          url=$(gcloud run services describe "$SERVICE" $WHERE --format='value(status.url)')
          old=$(curl -s --max-time 60 "$url/health" | jq -r '.model.version // ""' 2>/dev/null || true)
          echo "moved=true" >> "$GITHUB_OUTPUT"   # from here on, a failure rolls back
          # shellcheck disable=SC2086
          gcloud run services update-traffic "$SERVICE" $WHERE --to-revisions "$REVISION=$PERCENT,$PREVIOUS=$(( 100 - PERCENT ))" --quiet
          # shellcheck disable=SC2086
          gcloud run services describe "$SERVICE" $WHERE --format=json > "$RUNNER_TEMP/canary.json"
          python Model-Deployment/traffic.py serving "$RUNNER_TEMP/canary.json" --key split --expect "$REVISION" \
            --percent "$PERCENT" >> "$GITHUB_OUTPUT"
          python Model-Deployment/canary.py --url "$url" --tag-url "$TAG_URL" --version "$VERSION" --old-version "$old" \
            --github-output "$GITHUB_OUTPUT" || {
            echo "::error::the canary failed at ${PERCENT}%: rolling back to $PREVIOUS"
            exit 1; }

      # The move: all traffic to the revision that just passed (and its canary, when there is one), by name
      - name: Move traffic to the new revision (main)
        id: traffic
        if: env.ON_MAIN == 'true' && env.MOVE_TRAFFIC == 'true' && env.ALREADY_SERVING != 'true'
        env:
          SERVICE: ${{ steps.cfg.outputs.service }}
          WHERE: --region=${{ steps.cfg.outputs.region }} --project=${{ steps.cfg.outputs.project }}
          REVISION: ${{ steps.revision.outputs.name }}
        run: |
          if [ "${{ steps.history.outputs.present }}" != true ]; then
            echo "::error::won't move traffic: the image has no history.pkl, so it scores known SHAs only and refuses every push. ${REVISION} stays at 0%"
            exit 1
          fi
          start=$(date +%s)
          # shellcheck disable=SC2086
          echo "moved=true" >> "$GITHUB_OUTPUT"   # from here on, a failure rolls back
          gcloud run services update-traffic "$SERVICE" $WHERE --to-revisions "$REVISION=100" --quiet
          # shellcheck disable=SC2086
          gcloud run services describe "$SERVICE" $WHERE --format=json > "$RUNNER_TEMP/after.json"
          python Model-Deployment/traffic.py serving "$RUNNER_TEMP/after.json" --key serving --expect "$REVISION" \
            >> "$GITHUB_OUTPUT"
          echo "move_s=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"

      # The service's own URL, as a caller sees it: it must now serve the new champion
      - name: Smoke test, the service (main)
        id: smoke_live
        if: steps.traffic.outcome == 'success'
        run: |
          python Model-Deployment/smoke.py --url "${{ steps.traffic.outputs.url }}" \
            --version "${{ steps.champion.outputs.version }}" --md5 "${{ steps.champion.outputs.md5 }}" \
            --champion "$RUNNER_TEMP/stage/champion.json" --github-output "$GITHUB_OUTPUT" || {
            echo "::error::the service fails its smoke test after the move: rolling back to ${{ steps.revision.outputs.previous_revision }}"
            exit 1; }

      # Rollback: the move happened (or may have) and something after it failed. All traffic goes back, by name, to
      # the revision that served before this run; the new one stays deployed at 0% for a look. The run stays red
      - name: Roll back to the revision that served before (main)
        id: rollback
        if: >-
          always() && (steps.canary.outputs.moved == 'true' || steps.traffic.outputs.moved == 'true') &&
          (steps.canary.outcome == 'failure' || steps.traffic.outcome == 'failure' || steps.smoke_live.outcome == 'failure')
        env:
          SERVICE: ${{ steps.cfg.outputs.service }}
          WHERE: --region=${{ steps.cfg.outputs.region }} --project=${{ steps.cfg.outputs.project }}
          PREVIOUS: ${{ steps.revision.outputs.previous_revision }}
          FAILED: ${{ steps.revision.outputs.name }}
        run: |
          if [ -z "$PREVIOUS" ] || [ "$PREVIOUS" = "$FAILED" ]; then
            echo "::error::no earlier revision to roll back to: $FAILED keeps the traffic. Move it by hand"
            exit 1
          fi
          start=$(date +%s)
          # shellcheck disable=SC2086
          gcloud run services update-traffic "$SERVICE" $WHERE --to-revisions "$PREVIOUS=100" --quiet
          # shellcheck disable=SC2086
          gcloud run services describe "$SERVICE" $WHERE --format=json > "$RUNNER_TEMP/rolled_back.json"
          python Model-Deployment/traffic.py serving "$RUNNER_TEMP/rolled_back.json" --key serving --expect "$PREVIOUS" \
            >> "$GITHUB_OUTPUT"
          echo "rollback_s=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
          url=$(grep '^url=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)
          echo "health=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$url/health")" >> "$GITHUB_OUTPUT"
          echo "::error::rolled back: $FAILED failed after the move; $PREVIOUS serves 100% again"

      # S7: one Slack message per run on main, through meridian.alert: deployed, rolled back, rollback failed, or
      # stopped before any traffic moved. A no-traffic run that passes sends none. Slack never changes the outcome
      - name: Slack (main)
        id: slack
        if: always() && env.ON_MAIN == 'true'
        continue-on-error: true
        env:
          MERIDIAN_SLACK_WEBHOOK: ${{ secrets.MERIDIAN_SLACK_WEBHOOK }}
          VERSION: ${{ steps.champion.outputs.version }}
          REVISION: ${{ steps.revision.outputs.name }}
          PREVIOUS: ${{ steps.revision.outputs.previous_revision }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$VERSION" ] || VERSION=unknown
          why="${{ steps.canary.outcome == 'failure' && (steps.canary.outputs.canary_why || 'the traffic split') || (steps.traffic.outcome == 'failure' && 'the traffic check' || 'the live smoke test') }}"
          set -- --version "$VERSION" --revision "$REVISION" --serving "$PREVIOUS" \
            --run-url "$RUN_URL" --github-output "$GITHUB_OUTPUT"
          if [ "${{ steps.rollback.outcome }}" = success ] && [ "${{ steps.canary.outcome }}" = failure ]; then
            python Model-Deployment/notify.py canary_failed "$@" --why "$why" --percent "${{ steps.cfg.outputs.canary_percent }}" \
              --health "${{ steps.rollback.outputs.health }}"
          elif [ "${{ steps.rollback.outcome }}" = success ]; then
            python Model-Deployment/notify.py rolled_back "$@" --why "$why" --health "${{ steps.rollback.outputs.health }}"
          elif [ "${{ steps.rollback.outcome }}" = failure ]; then
            python Model-Deployment/notify.py rollback_failed "$@" --why "$why"
          elif [ "${{ steps.traffic.outcome }}" = success ] && [ "${{ steps.smoke_live.outcome }}" = success ]; then
            python Model-Deployment/notify.py deployed "$@" --md5 "${{ steps.champion.outputs.md5 }}" \
              --pr-auc "${{ steps.champion.outputs.pr_auc }}" --url "${{ steps.traffic.outputs.url }}"
          elif [ "${{ job.status }}" != success ]; then
            step="${{ (steps.champion.outcome == 'failure' && 'The champion, checked') || (steps.dispatch.outcome == 'failure' && 'The dispatch names another champion') || (steps.build.outcome == 'failure' && 'Build the serving image') || (steps.smoke_local.outcome == 'failure' && 'Smoke test, the image on the runner') || (steps.push.outcome == 'failure' && 'Push the image') || (steps.revision.outcome == 'failure' && 'Deploy a revision with no traffic') || (steps.smoke.outcome == 'failure' && 'Smoke test, the revision') || (steps.canary.outcome == 'failure' && 'Canary (before the split)') || (steps.traffic.outcome == 'failure' && 'Move traffic (before the move)') || 'an earlier step' }}"
            python Model-Deployment/notify.py stopped "$@" --step "$step"
          elif [ "$ALREADY_SERVING" = true ]; then
            echo "no message: the champion already serves, nothing was deployed"
            echo "slack_sent=none" >> "$GITHUB_OUTPUT"
          else
            echo "no message: a run that stops at the no-traffic revision and passes"
            echo "slack_sent=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        if: always()
        env:
          VERSION: ${{ steps.champion.outputs.version }}
        run: |
          {
            if [ "$DRY_RUN" = true ]; then
              echo "### deploy (dry run: built and smoke-tested on the runner; nothing pushed, no revision)"
            else
              if [ "$ALREADY_SERVING" = true ]; then
                echo "### deploy: nothing to do, the champion already serves"
              elif [ "${{ steps.rollback.outcome }}" = success ] && [ "${{ steps.canary.outcome }}" = failure ]; then
                echo "### deploy: the canary failed, the revision that served before serves 100% again"
              elif [ "${{ steps.rollback.outcome }}" = success ]; then
                echo "### deploy: rolled back, the revision that served before serves 100% again"
              elif [ "${{ steps.rollback.outcome }}" = failure ]; then
                echo "### deploy: ROLLBACK FAILED, check the service's traffic by hand"
              elif [ "${{ steps.traffic.outcome }}" = success ] && [ "${{ steps.smoke_live.outcome }}" = success ]; then
                echo "### deploy: the new revision serves 100% of traffic"
              else
                echo "### deploy: a revision with no traffic (traffic not moved)"
              fi
            fi
            echo "| | |"
            echo "|---|---|"
            echo "| Trigger | ${{ github.event_name == 'workflow_run' && 'model.yml finished green on main' || (github.event_name == 'repository_dispatch' && 'D3 champion-updated from the refresh job' || (github.event_name == 'workflow_dispatch' && 'by hand' || 'a pull request (dry run)')) }} |"
            echo "| Service | \`${{ steps.cfg.outputs.service }}\` in \`${{ steps.cfg.outputs.region }}\`, project \`${{ steps.cfg.outputs.project }}\` |"
            echo "| Champion | \`${VERSION:0:12}\`, md5 \`${{ steps.champion.outputs.md5 }}\`, val PR-AUC ${{ steps.champion.outputs.pr_auc }}, from the ${{ steps.champion.outputs.source }} registry |"
            echo "| Image | \`${{ steps.cfg.outputs.image }}:${VERSION:0:12}…\`: built in ${{ steps.build.outputs.build_s }} s, ${{ steps.build.outputs.size_mb }} MB uncompressed; history.pkl ${{ steps.history.outputs.present == 'true' && 'in (pushes scored)' || 'not in (known SHAs only)' }} |"
            echo "| Smoke test, on the runner | ${{ steps.smoke_local.outcome }} |"
            if [ "$DRY_RUN" != true ]; then
              echo "| Pushed | \`${{ steps.push.outputs.digest }}\` in ${{ steps.push.outputs.push_s }} s |"
              echo "| Revision | \`${{ steps.revision.outputs.name }}\`, ${{ steps.revision.outputs.percent }}% of traffic, deployed in ${{ steps.revision.outputs.deploy_s }} s, at ${{ steps.revision.outputs.url }} |"
              echo "| Before | ${{ steps.revision.outputs.previous }} |"
              echo "| Smoke test, the revision | ${{ steps.smoke.outcome }}: /health ${{ steps.smoke.outputs.smoke_health_s }} s, /score ${{ steps.smoke.outputs.smoke_score_s }} s, risk ${{ steps.smoke.outputs.smoke_risk }} |"
              echo "| Canary | ${{ steps.canary.outcome == 'skipped' && 'not run' || format('{0}: {1}% for {2} s ({3}); {4} calls reached it, {5} errors, p95 {6} ms; {7} of {8} service-URL calls answered by it{9}', steps.canary.outcome, steps.cfg.outputs.canary_percent, steps.canary.outputs.canary_watch_s, steps.canary.outputs.split, steps.canary.outputs.canary_canary_calls, steps.canary.outputs.canary_errors, steps.canary.outputs.canary_p95_ms, steps.canary.outputs.canary_new_via_service, steps.canary.outputs.canary_via_service, steps.canary.outputs.canary_why && format('. {0}', steps.canary.outputs.canary_why) || '') }} |"
              echo "| Traffic | ${{ steps.traffic.outcome == 'success' && format('moved in {0} s: {1}', steps.traffic.outputs.move_s, steps.traffic.outputs.serving) || (env.MOVE_TRAFFIC == 'true' && 'not moved' || 'not moved (move_traffic off)') }} |"
              echo "| Smoke test, the service | ${{ steps.smoke_live.outcome }}: ${{ steps.traffic.outputs.url }} |"
              echo "| Rollback | ${{ steps.rollback.outcome == 'skipped' && 'not needed' || format('{0} in {1} s: {2}; /health {3}', steps.rollback.outcome, steps.rollback.outputs.rollback_s, steps.rollback.outputs.serving, steps.rollback.outputs.health) }} |"
              echo "| Slack | ${{ steps.slack.outputs.slack_sent || steps.slack.outcome }} |"
            fi
            echo "| Outcome | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          # D5: one JSON line for Cloud Logging and S6's metrics. Versions only, never a person
          printf '{"severity": "%s", "event": "deploy", "model_version": "%s", "dry_run": %s, "revision": "%s", "traffic_percent": %s, "canary": "%s", "rolled_back": %s, "smoke": "%s", "outcome": "%s"}\n' \
            "$([ '${{ job.status }}' = success ] && echo INFO || echo ERROR)" "$VERSION" "$DRY_RUN" \
            "${{ steps.revision.outputs.name }}" "${{ steps.traffic.outcome == 'success' && steps.rollback.outcome != 'success' && '100' || '0' }}" \
            "${{ steps.canary.outcome }}" "${{ steps.rollback.outcome == 'success' }}" \
            "${{ steps.smoke_live.outcome == 'success' && steps.smoke_live.outcome || (env.ON_MAIN == 'true' && steps.smoke.outcome || steps.smoke_local.outcome) }}" "${{ job.status }}"
