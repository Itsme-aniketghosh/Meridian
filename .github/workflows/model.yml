# Model CI (step H, Chaitali): the model pipeline in its Docker image, then, on main, the registry and its push to
# Artifact Registry. Slack hears one message when a run fails, and a done (and, on main, a push) message otherwise.
#
#   image:    Model-Pipeline/Dockerfile, GIT_SHA = this commit, so MLflow tags name the code (Contract 3)
#   pipeline: run_all in the image: data -> train -> seed noise -> evaluate -> bias -> gate. On a copy of reports/, so
#             the checkout stays clean and the registry can tell the code is committed
#   registry: main only, after the gate passes, in the checkout, not the image (git has to see the commit): register,
#             promote, push (Rochan, #58). Google trusts this repo's main branch only (Workload Identity, no key)
#
# What CI trains and when it runs: packets/chaitali-bias/decisions.md, decisions 7 and 8.
name: model

on:
  push:
    branches: [main]
    paths: ["Model-Pipeline/**", ".github/workflows/model.yml"]
  pull_request:
    paths: ["Model-Pipeline/**", ".github/workflows/model.yml"]
  workflow_dispatch:  # from the Actions tab
    inputs:
      train:
        description: "search: the full Optuna search; refit: the committed candidate (decision 7)"
        type: choice
        options: [search, refit]
        default: search

permissions:
  contents: read

concurrency:  # a newer push to a PR replaces its run; main's runs finish, since they register
  group: model-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write  # the Google sign-in on main; a fork's PR never gets it
    env:
      MERIDIAN_SLACK_WEBHOOK: ${{ secrets.MERIDIAN_SLACK_WEBHOOK }}
      ON_MAIN: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TRAIN: ${{ inputs.train || 'search' }}  # decision 7: what pushes and PRs train
    steps:
      - uses: actions/checkout@v4

      - name: Secrets
        run: |
          echo "OUT=$RUNNER_TEMP/reports" >> "$GITHUB_ENV"  # the pipeline's copy of reports/
          if [ -z "$MERIDIAN_SLACK_WEBHOOK" ]; then
            msg="No Slack webhook in this run"
            [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ] && msg="$msg: a PR from a fork gets no secrets"
            echo "::notice::$msg. Messages go to this summary only."
            echo "**$msg.** Messages go to this summary only." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Model-Pipeline/Dockerfile
          build-args: GIT_SHA=${{ github.sha }}
          tags: meridian-model:ci
          load: true
          cache-from: type=gha,scope=model
          cache-to: type=gha,scope=model,mode=max

      - name: Pipeline (data, train, seed noise, evaluate, bias, gate) in the image
        id: pipeline
        run: |
          cp -r Model-Pipeline/reports "$OUT"
          mkdir -p Model-Pipeline/registry
          refit=""
          [ "$TRAIN" = "refit" ] && refit="--refit"
          echo "train: $TRAIN" >> "$GITHUB_STEP_SUMMARY"
          start=$(date +%s)
          set -o pipefail
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e MLFLOW_TRACKING_URI=sqlite:////tmp/mlflow.db \
            -v "$OUT:/app/Model-Pipeline/reports" \
            -v "$PWD/Model-Pipeline/registry:/app/Model-Pipeline/registry:ro" \
            meridian-model:ci $refit --until gate 2>&1 | tee "$RUNNER_TEMP/pipeline.log"
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"

      # LLM bias (step M): the agents' fallback and diff match rates by slice. CI's store has no agent calls, so the
      # fallback side says so; a flagged slice outside [llm_bias] accepted fails the run
      - name: LLM bias in the image
        id: llm_bias
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e MLFLOW_TRACKING_URI=sqlite:////tmp/mlflow.db \
            -v "$OUT:/app/Model-Pipeline/reports" -v "$PWD/Model-Pipeline/packets:/app/Model-Pipeline/packets:ro" \
            --entrypoint python meridian-model:ci -m model.llm_bias --no-calls --no-charts \
            | tee "$RUNNER_TEMP/llm_bias.log"
          { echo "### LLM bias"; sed 's/^/    /' "$RUNNER_TEMP/llm_bias.log"; } >> "$GITHUB_STEP_SUMMARY"
          [ "$(jq -r .pass "$OUT/llm_bias.json")" = "true" ] || { echo "FAILED at llm bias: an open flag" | tee -a "$RUNNER_TEMP/pipeline.log"; exit 1; }

      - name: Gate summary
        if: always()
        run: |
          log="$RUNNER_TEMP/pipeline.log"
          {
            echo "### Model pipeline: ${{ steps.pipeline.outcome }} (${{ steps.pipeline.outputs.seconds || '?' }} s)"
            grep -E "^\[[0-9]+/[0-9]+\]|^FAILED at|^stopped after|^(ok  |FAIL) " "$log" 2>/dev/null | sed 's/^/    /'
            [ "$ON_MAIN" = "true" ] || echo "Not main: the run stops at the gate and nothing is registered or pushed."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        if: env.ON_MAIN == 'true'
        id: py
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        if: env.ON_MAIN == 'true'
        id: venv
        with:
          path: .venv
          key: venv-model-${{ runner.os }}-${{ steps.py.outputs.python-version }}-${{ hashFiles('Data-Pipeline/requirements.txt', 'Model-Pipeline/requirements.txt') }}
      - name: Install the model's packages
        if: env.ON_MAIN == 'true'
        run: |
          [ "${{ steps.venv.outputs.cache-hit }}" = "true" ] || { python -m venv .venv && .venv/bin/pip install -r Model-Pipeline/requirements.txt; }
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - uses: google-github-actions/auth@v2
        if: env.ON_MAIN == 'true'
        with:
          workload_identity_provider: projects/541739670966/locations/global/workloadIdentityPools/github/providers/meridian
          service_account: meridian-ci@project-448b7a64-b5c5-43d3-893.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
        if: env.ON_MAIN == 'true'

      - name: Registry (register, promote, push)
        id: registry
        if: env.ON_MAIN == 'true'
        working-directory: Model-Pipeline
        run: |
          set -o pipefail
          python -m model.registry --push --candidate "$OUT/candidate.json" --metrics "$OUT/metrics.json" \
            --bias "$OUT/bias_report.json" --seed-noise "$OUT/seed_noise.json" 2>&1 | tee "$RUNNER_TEMP/registry.log"
          { echo "### Registry"; sed 's/^/    /' "$RUNNER_TEMP/registry.log"; } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$(git status --porcelain -- registry)" ]; then
            echo "**registry/ changed: commit the \`champion\` artifact's files to Model-Pipeline/registry/.**" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-reports
          path: |
            ${{ runner.temp }}/reports/metrics.json
            ${{ runner.temp }}/reports/bias_report.json
            ${{ runner.temp }}/reports/gate.json
            ${{ runner.temp }}/reports/llm_bias.json
            ${{ runner.temp }}/reports/seed_noise.json
            ${{ runner.temp }}/reports/candidate.json
            ${{ runner.temp }}/pipeline.log
            ${{ runner.temp }}/registry.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: steps.registry.outcome == 'success'
        with:
          name: champion
          path: Model-Pipeline/registry/
          if-no-files-found: ignore

      # One message when the run fails; a done message, and on main a push message, when it doesn't.
      - name: Slack
        if: always()
        env:
          PIPELINE: ${{ steps.pipeline.outcome }}
          LLM_BIAS: ${{ steps.llm_bias.outcome }}
          REGISTRY: ${{ steps.registry.outcome }}
          WHERE: ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.number) || github.ref_name }} @ ${{ github.sha }}
        run: |
          post() {
            echo "$1" >> "$GITHUB_STEP_SUMMARY"
            [ -n "$MERIDIAN_SLACK_WEBHOOK" ] || return 0
            jq -n --arg t "$1" '{text: $t}' | curl -sS -m 10 -X POST -H 'Content-Type: application/json' \
              --data @- "$MERIDIAN_SLACK_WEBHOOK" >/dev/null || echo "::warning::Slack didn't take the message"
          }
          gate="$OUT/gate.json"
          if [ "$PIPELINE" != "success" ] || [ "$LLM_BIAS" != "success" ] || [ "$REGISTRY" = "failure" ]; then
            at=$(grep -m1 "^FAILED at" "$RUNNER_TEMP/pipeline.log" 2>/dev/null || true)
            [ "$PIPELINE" = "success" ] && at="FAILED at the registry: $(tail -n 3 "$RUNNER_TEMP/registry.log" 2>/dev/null)"
            why=""
            [ -f "$gate" ] && [ "$(jq -r .pass "$gate")" = "false" ] && why=$(jq -r '.checks[] | select(.ok | not) | "• \(.check): \(.why)"' "$gate")
            post "$(printf 'Model CI failed on %s\n%s\n%s\n%s' "$WHERE" "${at:-$PIPELINE}" "$why" "$RUN_URL")"
            exit 0
          fi
          done=$(jq -r '"\(.candidate): " + ([.checks[] | select(.check == "bar") | .why] | join("")) + "; bias and gate pass"' "$gate")
          note="not registered: only main registers"
          [ "$ON_MAIN" = "true" ] && note="registering next"
          post "$(printf 'Model CI done on %s (%s s)\n%s\n%s\n%s' "$WHERE" "${{ steps.pipeline.outputs.seconds }}" "$done" "$note" "$RUN_URL")"
          if [ "$REGISTRY" = "success" ]; then
            post "$(printf 'Model registry on %s\n%s\n%s' "$WHERE" "$(grep -iE "promot|push|champion|skip" "$RUNNER_TEMP/registry.log" | tail -n 4)" "$RUN_URL")"
          fi
