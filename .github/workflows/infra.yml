# Checks the infrastructure code on every PR and push that touches it: deploy.toml's names and numbers (and that
# phase 2's copies in model.toml and model.yml agree), and the Terraform's format and validity. No cloud access,
# no secrets: plan and apply stay with the project owner.
name: infra

on:
  pull_request:
    paths:
      - "infra/**"
      - "Model-Deployment/deploy.toml"
      - "Model-Deployment/deploy_config.py"
      - "Model-Deployment/tests/**"
      - "Model-Pipeline/model.toml"
      - ".github/workflows/model.yml"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "Model-Deployment/deploy.toml"
      - "Model-Deployment/deploy_config.py"
      - "Model-Deployment/tests/**"
      - "Model-Pipeline/model.toml"
      - ".github/workflows/model.yml"
      - ".github/workflows/infra.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Only the tests that need nothing installed: the drift and serve tests need the model's environment and run in
      # ci.yml's model job.
      - name: deploy.toml (D4) and the champion pointer
        run: |
          python -m unittest discover -s Model-Deployment/tests -p "test_deploy_config.py" -v
          python -m unittest discover -s Model-Deployment/tests -p "test_champion.py" -v

      - name: flake8
        run: |
          python -m pip install flake8==7.4.1
          python -m flake8 --max-line-length 120 --per-file-ignores="Model-Deployment/tests/*:E402" Model-Deployment/deploy_config.py Model-Deployment/tests

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.4"

      - name: terraform fmt
        run: terraform -chdir=infra/terraform fmt -check -recursive

      - name: terraform validate
        run: |
          terraform -chdir=infra/terraform init -backend=false -input=false
          terraform -chdir=infra/terraform validate
